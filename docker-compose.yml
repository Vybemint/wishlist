services:
  server:
    image: ${IMAGE:-vybemint/wishlist:latest}
    env_file:
      - ./server/.env
    environment:
      - DB_PATH=/data/waitlist.db
    volumes:
      - db-data:/data
    networks:
      - internal
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 20s
        max_attempts: 10
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${TRAEFIK_SERVICE_NAME:-vybemint-wishlist}.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
        - "traefik.http.routers.${TRAEFIK_SERVICE_NAME:-vybemint-wishlist}.entrypoints=web,websecure"
        - "traefik.http.routers.${TRAEFIK_SERVICE_NAME:-vybemint-wishlist}.tls=true"
        - "traefik.http.routers.${TRAEFIK_SERVICE_NAME:-vybemint-wishlist}.tls.certresolver=letsencrypt"
        - "traefik.http.services.${TRAEFIK_SERVICE_NAME:-vybemint-wishlist}.loadbalancer.server.port=3001"

volumes:
  db-data:
    driver: local

networks:
  internal:
    driver: overlay
    attachable: true
  traefik-public:
    external: true
