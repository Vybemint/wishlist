# fly.toml configuration for VybeMint
app = "vybemint"
primary_region = "bom"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "waitlist_data"
  destination = "/data"
